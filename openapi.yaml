openapi: 3.1.0
info:
  title: Caja Link
  version: 0.1.0
  description: "Contrato Profesional implementado de Caja Link: consultas v1/v2, lotes persistentes y
    auditoría. Tokens opacos identifican consumidores o administrador. La carga independiente
    verificó 10000 filas sin errores; métricas y condiciones están en docs/load-test.md. Los
    ejemplos son ilustrativos con datos sintéticos. La evidencia propia de Sur no constituye
    ejecución del P14 oficial."
servers:
  - url: http://localhost:8083
security:
  - bearerAuth: []
paths:
  /api/v1/affiliations/{document}:
    get:
      operationId: queryAffiliationV1
      description: "Solo token consumidor; ADMIN_TOKEN devuelve 403. Excluye su caja antes de consultar.
        Vigencia: validFrom <= corte Colombia y validTo nulo o >= corte. Una coincidencia conserva
        unavailable; sin coincidencias y con alguna falla resulta INDETERMINADO. NO_AFILIADO exige
        ausencia confirmada. Finalidad inválida o ausente devuelve 400."
      parameters:
        - $ref: "#/components/parameters/Document"
        - $ref: "#/components/parameters/Purpose"
      responses:
        "200":
          description: Resultado mínimo; NO_AFILIADO solo con ausencia confirmada en todos los orígenes
            requeridos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AffiliationResponseV1"
              example:
                requestId: 00000000-0000-4000-8000-000000000001
                result: AFILIADO_OTRA_CAJA
                matches:
                  - caja: CENTRO
                    validFrom: 2024-01-01
                    validTo: null
                    source: FILE
                    asOf: 2026-10-03
                unavailable:
                  - ORIENTE
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
      tags:
        - Afiliaciones
  /api/v2/affiliations/{document}:
    get:
      operationId: queryAffiliationV2
      description: Mismos permisos, finalidad y reglas de vigencia/fallas que v1. Añade exclusivamente
        affiliateType a cada match; v1 conserva sus cinco campos.
      parameters:
        - $ref: "#/components/parameters/Document"
        - $ref: "#/components/parameters/Purpose"
      responses:
        "200":
          description: Resultado canónico versión 2.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AffiliationResponseV2"
              example:
                requestId: 00000000-0000-4000-8000-000000000002
                result: AFILIADO_OTRA_CAJA
                matches:
                  - caja: CENTRO
                    validFrom: 2024-01-01
                    validTo: null
                    source: FILE
                    asOf: 2026-10-03
                    affiliateType: DEPENDIENTE
                unavailable:
                  - ORIENTE
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
      tags:
        - Afiliaciones
  /api/v1/batch-checks:
    post:
      operationId: submitBatch
      description: "Solo consumidor. CSV UTF-8 con columna document, hasta BATCH_MAX_DOCUMENTS filas y
        BODY_LIMIT_BYTES bytes, como text/csv o multipart file. purpose omitido usa
        VALIDACION_AFILIACION. Clave única por consumidor: mismo hash de finalidad y secuencia
        normalizada (orden y duplicados incluidos) devuelve mismo jobId; contenido o finalidad
        diferente devuelve 409. Devuelve 202 antes de procesar. El worker persiste avance y reanuda
        trabajos interrumpidos."
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
          description: Clave opaca por consumidor, entre 1 y 200 caracteres.
        - in: query
          name: purpose
          required: false
          schema:
            allOf:
              - $ref: "#/components/schemas/Purpose"
            default: VALIDACION_AFILIACION
      requestBody:
        required: true
        content:
          text/csv:
            schema:
              type: string
            example: |
              document
              1234567890
              001.234.567.890
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              additionalProperties: false
              properties:
                file:
                  type: string
                  format: binary
            encoding:
              file:
                contentType: text/csv
        description: La columna document es obligatoria; las filas se validan y normalizan antes de crear el
          trabajo.
      responses:
        "202":
          description: Trabajo aceptado, pendiente o previamente creado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchAccepted"
              example:
                jobId: 00000000-0000-4000-8000-000000000003
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Clave reutilizada para contenido o finalidad diferentes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: Cuerpo o número de documentos excede el límite configurado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "415":
          description: Tipo de contenido no admitido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
      tags:
        - Lotes
  /api/v1/batch-checks/{jobId}:
    get:
      operationId: getBatch
      description: Solo consumidor dueño. Otro consumidor obtiene 404 y ADMIN_TOKEN obtiene 403. PENDING y
        RUNNING devuelven results vacío. DONE devuelve todas las filas en orden, con documento
        normalizado y DTO v1, sin affiliateType. Los resultados parciales se usan internamente para
        recuperación y no se reconstruyen en cada GET público antes de DONE.
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Estado persistente. results=[] en PENDING/RUNNING; en DONE, resultados completos con
            una salida por fila y duplicados conservados.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchResponse"
              examples:
                pendiente:
                  value:
                    status: PENDING
                    results: []
                ejecutando:
                  value:
                    status: RUNNING
                    results: []
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Trabajo inexistente o no visible para el consumidor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
      tags:
        - Lotes
  /api/v1/audit:
    get:
      operationId: listAudit
      description: Exclusivamente ADMIN_TOKEN; consumidores obtienen 403. Devuelve un array con timestamp
        UTC, requestingCaja, purpose, result y documentMasked. Entradas más recientes primero.
        Máximo cuatro dígitos visibles, sin requestId interno de persistencia.
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
      responses:
        "200":
          description: Trazabilidad con un máximo de cuatro dígitos visibles por documento.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditEntry"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
      tags:
        - Auditoría
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Token opaco del entorno; cuatro identidades consumidoras y una administrativa.
  parameters:
    Document:
      name: document
      in: path
      required: true
      description: Dígitos, puntos y espacios; elimina separadores y ceros de relleno sin conversión
        numérica. Longitud de entrada hasta 64; forma normalizada de uno a doce dígitos.
      schema:
        type: string
        minLength: 1
        maxLength: 64
        pattern: ^[0-9.\s]+$
    Purpose:
      name: purpose
      in: query
      required: true
      schema:
        $ref: "#/components/schemas/Purpose"
      description: Finalidad obligatoria en consultas individuales; debe pertenecer al enum.
  responses:
    InvalidRequest:
      description: Documento, finalidad u otra entrada inválida o faltante.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Token ausente o inválido.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Identidad sin permiso para la operación.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unavailable:
      description: Dependencia propia indispensable no disponible; las fallas de cajas se expresan en
        unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: Error interno; no expone mensajes, stack, SQL ni payload externo.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    CajaId:
      type: string
      enum:
        - NORTE
        - ORIENTE
        - CENTRO
        - SUR
    Purpose:
      type: string
      enum:
        - TARIFA_SUBSIDIADA
        - SUBSIDIO_MONETARIO
        - VALIDACION_AFILIACION
    AffiliationResult:
      type: string
      enum:
        - AFILIADO_OTRA_CAJA
        - NO_AFILIADO
        - INDETERMINADO
    MatchV1:
      type: object
      additionalProperties: false
      required:
        - caja
        - validFrom
        - validTo
        - source
        - asOf
      properties:
        caja:
          $ref: "#/components/schemas/CajaId"
        validFrom:
          type: string
          format: date
        validTo:
          type:
            - string
            - "null"
          format: date
        source:
          type: string
          enum:
            - ONLINE
            - FILE
        asOf:
          type: string
          format: date
          description: "ONLINE: corte calendario America/Bogota de consulta. FILE: FECHA_CORTE de la
            publicación de Centro."
    MatchV2:
      type: object
      additionalProperties: false
      required:
        - caja
        - validFrom
        - validTo
        - source
        - asOf
        - affiliateType
      properties:
        caja:
          $ref: "#/components/schemas/CajaId"
        validFrom:
          type: string
          format: date
        validTo:
          type:
            - string
            - "null"
          format: date
        source:
          type: string
          enum:
            - ONLINE
            - FILE
        asOf:
          type: string
          format: date
          description: "ONLINE: corte calendario America/Bogota de consulta. FILE: FECHA_CORTE de la
            publicación de Centro."
        affiliateType:
          type: string
          enum:
            - DEPENDIENTE
            - INDEPENDIENTE
            - PENSIONADO
    AffiliationResponseV1:
      type: object
      additionalProperties: false
      required:
        - requestId
        - result
        - matches
        - unavailable
      properties:
        requestId:
          type: string
          minLength: 1
        result:
          $ref: "#/components/schemas/AffiliationResult"
        matches:
          type: array
          items:
            $ref: "#/components/schemas/MatchV1"
        unavailable:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/CajaId"
    AffiliationResponseV2:
      type: object
      additionalProperties: false
      required:
        - requestId
        - result
        - matches
        - unavailable
      properties:
        requestId:
          type: string
          minLength: 1
        result:
          $ref: "#/components/schemas/AffiliationResult"
        matches:
          type: array
          items:
            $ref: "#/components/schemas/MatchV2"
        unavailable:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/CajaId"
    BatchAccepted:
      type: object
      additionalProperties: false
      required:
        - jobId
      properties:
        jobId:
          type: string
          format: uuid
    BatchRow:
      type: object
      additionalProperties: false
      required:
        - document
        - requestId
        - result
        - matches
        - unavailable
      properties:
        document:
          type: string
          pattern: ^[0-9]+$
        requestId:
          type: string
          minLength: 1
        result:
          $ref: "#/components/schemas/AffiliationResult"
        matches:
          type: array
          items:
            $ref: "#/components/schemas/MatchV1"
        unavailable:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/CajaId"
    BatchResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - results
      properties:
        status:
          type: string
          enum:
            - PENDING
            - RUNNING
            - DONE
        results:
          type: array
          items:
            $ref: "#/components/schemas/BatchRow"
      description: PENDING/RUNNING devuelven results vacío; DONE entrega todas las filas ordenadas,
        incluidos duplicados. El corte deriva de createdAt; FILE conserva la fecha publicada. Los
        parciales persistidos son de uso interno del worker.
      allOf:
        - if:
            properties:
              status:
                enum:
                  - PENDING
                  - RUNNING
            required:
              - status
          then:
            properties:
              results:
                maxItems: 0
    AuditEntry:
      type: object
      additionalProperties: false
      required:
        - timestamp
        - requestingCaja
        - purpose
        - result
        - documentMasked
      properties:
        timestamp:
          type: string
          format: date-time
        requestingCaja:
          $ref: "#/components/schemas/CajaId"
        purpose:
          $ref: "#/components/schemas/Purpose"
        result:
          $ref: "#/components/schemas/AffiliationResult"
        documentMasked:
          type: string
          pattern: ^[^0-9]*[0-9]{0,4}$
          minLength: 1
    Error:
      type: object
      additionalProperties: false
      required:
        - error
        - requestId
      properties:
        error:
          type: string
          enum:
            - INVALID_REQUEST
            - UNAUTHORIZED
            - FORBIDDEN
            - NOT_FOUND
            - CONFLICT
            - UNAVAILABLE
            - INTERNAL_ERROR
        requestId:
          type: string
          minLength: 1
      description: Código fijo y requestId generado por el servicio; nunca contiene error interno, token
        ni documento.
tags:
  - name: Afiliaciones
    description: Consultas individuales v1 y v2.
  - name: Lotes
    description: Creación idempotente y consulta de trabajo propio.
  - name: Auditoría
    description: Lectura exclusiva del administrador.
x-infrastructure-endpoints:
  /health:
    get:
      operationId: health
      security: []
      description: Liveness del proceso; no comprueba los orígenes.
      responses:
        "200":
          description: Proceso disponible.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - status
                properties:
                  status:
                    type: string
                    const: ok
  /ready:
    get:
      operationId: ready
      security: []
      description: PostgreSQL disponible tras migraciones aplicadas al arrancar; no afirma negocio completo.
      responses:
        "200":
          description: Infraestructura base lista.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - status
                  - database
                properties:
                  status:
                    type: string
                    const: ready
                  database:
                    type: string
                    const: up
        "503":
          $ref: "#/components/responses/Unavailable"
