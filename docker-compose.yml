name: caja-link

x-caja: &caja
  build: ./mocks
  env_file: .env
  volumes:
    - ./mocks/data:/data:ro

services:
  caja-norte:
    <<: *caja
    environment:
      CAJA: norte
      PORT: "9001"
    ports:
      - "${CAJA_NORTE_PORT:-9001}:9001"

  caja-oriente:
    <<: *caja
    environment:
      CAJA: oriente
      PORT: "9002"
    ports:
      - "${CAJA_ORIENTE_PORT:-9002}:9002"

  # Cuarta caja: docker compose --profile caja-sur up -d
  caja-sur:
    <<: *caja
    profiles: ["caja-sur"]
    environment:
      CAJA: sur
      PORT: "9004"
    ports:
      - "${CAJA_SUR_PORT:-9004}:9004"

  # Agreguen aquí su servicio de interoperabilidad (puerto de contrato 8083).
  # Caja Centro no tiene servicio: monten ./caja-centro (archivo plano diario).
